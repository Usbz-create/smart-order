<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | Smart Order</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1e2d50" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: linear-gradient(160deg, #1e2d50, #2c3e6b);
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      backdrop-filter: blur(10px);
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h2 { font-size: 22px; margin-bottom: 8px; }
    p { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2980b9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h2>You're Offline</h2>
    <p>No internet connection detected. Please check your network and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
