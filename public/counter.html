<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter | Smart Order</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">

    <header class="hero dashboard-hero" style="background:linear-gradient(135deg,#8e44ad,#6c3483);">
      <div>
        <h1>🧾 Counter</h1>
        <p class="subtitle">Confirm payments for all tables.</p>
      </div>
      <button onclick="logout()" class="ghost">Logout</button>
    </header>

    <section class="card">
      <h2>Pending Bills</h2>
      <div id="bills-container" class="orders"><p class="empty">Loading…</p></div>
    </section>

  </main>

  <!-- Payment confirmation modal -->
  <div id="confirm-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:2000;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:16px;padding:32px 24px;max-width:320px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3);">
      <p style="font-size:40px;margin:0 0 8px;">💳</p>
      <h2 style="margin:0 0 8px;">Confirm Payment?</h2>
      <p style="color:#555;margin:0 0 24px;font-size:15px;" id="modal-body"></p>
      <div style="display:flex;gap:12px;">
        <button onclick="closeModal()" style="flex:1;padding:14px;border:2px solid #ccc;background:white;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600;color:#333;">✕ Cancel</button>
        <button id="modal-confirm-btn" style="flex:1;padding:14px;background:#8e44ad;color:white;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:700;">✅ Confirm</button>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('restaurantRole') !== 'counter') location.href = '/index.html';

    function logout() { localStorage.removeItem('restaurantRole'); location.href = '/index.html'; }

    let pendingTable = null, pendingSession = null;

    async function loadBills() {
      const container = document.getElementById('bills-container');
      try {
        const res    = await fetch('/orders');
        if (!res.ok) throw new Error();
        const orders = await res.json();

        const foodOrders = orders.filter(o => o.status !== 'call_waiter' && Array.isArray(o.items) && o.items.length > 0);

        // Group by session — each person at a table is their own bill
        const bySess = {};
        foodOrders.forEach(o => {
          const key = o.tableNumber + '__' + o.sessionId;
          if (!bySess[key]) bySess[key] = [];
          bySess[key].push(o);
        });

        // Show sessions where ALL orders are served/ready AND customer pressed View Bill
        const billable = Object.keys(bySess).filter(k =>
          bySess[k].every(o => o.status === 'served' || o.status === 'ready') &&
          bySess[k].some(o => o.billRequested === 1)
        );

        if (!billable.length) { container.innerHTML = '<p class="empty">✅ No pending bills right now.</p>'; return; }

        container.innerHTML = billable.map(k => {
          const sess  = bySess[k];
          const table = sess[0].tableNumber;
          const sid   = sess[0].sessionId;
          const total = sess.reduce((s, o) => s + Number(o.totalPrice || 0), 0);
          const merged = {};
          sess.flatMap(o => o.items).forEach(i => { if (!merged[i.name]) merged[i.name] = 0; merged[i.name] += i.quantity; });
          const summary = Object.entries(merged).map(([n, q]) => n + ' ×' + q).join(', ');
          return `<article class="order-card" style="border-left:4px solid #8e44ad;background:#fdf8ff;">
            <p style="font-size:20px;font-weight:700;margin:0 0 4px;">Table ${table}</p>
            <p style="color:#999;font-size:11px;margin:0 0 8px;font-family:monospace;">Session: ${sid}</p>
            <p style="color:#666;font-size:13px;margin:0 0 10px;">${summary}</p>
            <p style="font-size:24px;font-weight:700;color:#8e44ad;margin:0 0 16px;">Rs ${total.toFixed(2)}</p>
            <button onclick="startConfirm('${table}','${sid}',${total.toFixed(2)})"
              style="width:100%;padding:14px;background:#8e44ad;color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;">
              💳 Confirm Payment
            </button>
          </article>`;
        }).join('');
      } catch { setTimeout(loadBills, 3000); }
    }

    function startConfirm(table, sid, total) {
      pendingTable = table; pendingSession = sid;
      document.getElementById('modal-body').innerText = 'Table ' + table + ' — Rs ' + Number(total).toFixed(2) + '. Mark as paid?';
      document.getElementById('modal-confirm-btn').onclick = doConfirmPayment;
      document.getElementById('confirm-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('confirm-modal').style.display = 'none';
      pendingTable = null; pendingSession = null;
    }

    async function doConfirmPayment() {
      const table = pendingTable, sid = pendingSession;
      closeModal();
      try {
        const res  = await fetch('/table/' + table + '/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: sid }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Checkout failed');
        loadBills();
      } catch (err) { alert(err.message); }
    }

    loadBills();
    setInterval(loadBills, 5000);
  </script>
</body>
</html>
