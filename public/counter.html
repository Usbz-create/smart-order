<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter | Smart Order</title>
  <link rel="manifest" href="/manifest-counter.json" />
  <meta name="theme-color" content="#8e44ad" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Counter" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">

    <header class="hero dashboard-hero" style="background:linear-gradient(135deg,#8e44ad,#6c3483);">
      <div>
        <h1>🧾 Counter</h1>
        <p class="subtitle">Confirm payments for all tables.</p>
      </div>
      <button id="logoutBtn" class="ghost">Logout</button>
    </header>

    <section class="card">
      <h2>Pending Bills</h2>
      <div id="bills-container" class="orders"><p class="empty">Loading…</p></div>
    </section>

  </main>

  <!-- Payment confirmation modal -->
  <div id="confirm-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:2000;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:16px;padding:32px 24px;max-width:320px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3);">
      <p style="font-size:40px;margin:0 0 8px;">💳</p>
      <h2 style="margin:0 0 8px;">Confirm Payment?</h2>
      <p style="color:#555;margin:0 0 24px;font-size:15px;" id="modal-body"></p>
      <div style="display:flex;gap:12px;">
        <button id="modal-cancel-btn" style="flex:1;padding:14px;border:2px solid #ccc;background:white;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600;color:#333;">✕ Cancel</button>
        <button id="modal-confirm-btn" style="flex:1;padding:14px;background:#8e44ad;color:white;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:700;">✅ Confirm</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW fail:', e));
    }
  </script>
  <script src="/js/auth.js"></script>
  <script>
    // Use auth.js consistently — same as all other staff pages
    requireRole('counter');

    const role = getRole();

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('staffPin_' + role);
      clearRole();
      location.href = '/index.html';
    });

    // ── PIN guard — re-ask if PIN was lost (e.g. page reload after tab close) ──
    function getStoredPin() { return localStorage.getItem('staffPin_counter') || ''; }

    function ensurePin() {
      if (getStoredPin()) return true;
      // PIN is gone — show re-entry prompt at top of page
      const existing = document.getElementById('pin-reentry-banner');
      if (!existing) {
        const banner = document.createElement('div');
        banner.id = 'pin-reentry-banner';
        banner.style.cssText = 'background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;';
        banner.innerHTML = `
          <span style="font-size:14px;flex:1;">🔑 Session expired. Re-enter your Counter PIN to confirm payments.</span>
          <input id="reentry-pin" type="password" placeholder="Counter PIN" maxlength="20"
            style="padding:8px 12px;border:1px solid #ccc;border-radius:8px;font-size:15px;width:150px;" />
          <button id="reentry-btn" style="padding:9px 18px;background:#8e44ad;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">Confirm</button>
          <span id="reentry-msg" style="color:#c00;font-size:13px;"></span>`;
        document.querySelector('.container main, main.container, main').prepend(banner);

        document.getElementById('reentry-btn').addEventListener('click', async () => {
          const pin = document.getElementById('reentry-pin').value.trim();
          const msg = document.getElementById('reentry-msg');
          if (!pin) { msg.textContent = 'Enter your PIN.'; return; }
          try {
            const r = await fetch('/auth/login', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ role: 'counter', pin })
            });
            const d = await r.json();
            if (!r.ok) { msg.textContent = d.message || 'Wrong PIN.'; return; }
            localStorage.setItem('staffPin_counter', pin);
            banner.remove();
          } catch { msg.textContent = 'Login failed. Check connection.'; }
        });
      }
      return false;
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    let pendingTable = null, pendingSession = null;

    async function loadBills() {
      const container = document.getElementById('bills-container');
      try {
        const res    = await fetch('/orders');
        if (!res.ok) throw new Error();
        const orders = await res.json();

        const foodOrders = orders.filter(o => o.status !== 'call_waiter' && Array.isArray(o.items) && o.items.length > 0);

        const bySess = {};
        foodOrders.forEach(o => {
          const key = o.tableNumber + '__' + o.sessionId;
          if (!bySess[key]) bySess[key] = [];
          bySess[key].push(o);
        });

        const billable = Object.keys(bySess).filter(k =>
          bySess[k].every(o => o.status === 'served' || o.status === 'ready') &&
          bySess[k].some(o => Number(o.billRequested) === 1)
        );

        if (!billable.length) { container.innerHTML = '<p class="empty">✅ No pending bills right now.</p>'; return; }

        container.innerHTML = billable.map(k => {
          const sess  = bySess[k];
          const table = sess[0].tableNumber;
          const sid   = sess[0].sessionId;
          const total = sess.reduce((s, o) => s + Number(o.totalPrice || 0), 0);
          const merged = {};
          sess.flatMap(o => o.items).forEach(i => { if (!merged[i.name]) merged[i.name] = 0; merged[i.name] += i.quantity; });
          const summary = Object.entries(merged).map(([n, q]) => esc(n) + ' ×' + q).join(', ');
          // Store table/session in data attributes — no inline onclick with string interpolation
          return `<article class="order-card" style="border-left:4px solid #8e44ad;background:#fdf8ff;"
                    data-table="${esc(String(table))}" data-session="${esc(String(sid))}" data-total="${total.toFixed(2)}">
            <p style="font-size:26px;font-weight:700;margin:0 0 6px;">Table ${esc(String(table))}</p>
            <p style="color:#999;font-size:13px;margin:0 0 8px;font-family:monospace;">Session: ${esc(String(sid))}</p>
            <p style="color:#666;font-size:18px;margin:0 0 12px;">${summary}</p>
            <p style="font-size:30px;font-weight:700;color:#8e44ad;margin:0 0 16px;">Rs ${total.toFixed(2)}</p>
            <button class="confirm-payment-btn"
              style="width:100%;padding:14px;background:#8e44ad;color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;">
              💳 Confirm Payment
            </button>
          </article>`;
        }).join('');

        // Event delegation — no inline onclick with raw session data
        container.querySelectorAll('.confirm-payment-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const card = btn.closest('article');
            startConfirm(card.dataset.table, card.dataset.session, Number(card.dataset.total));
          });
        });

      } catch { setTimeout(loadBills, 3000); }
    }

    function startConfirm(table, sid, total) {
      if (!ensurePin()) { alert('Please re-enter your Counter PIN first (see banner above).'); return; }
      pendingTable = table; pendingSession = sid;
      document.getElementById('modal-body').textContent = 'Table ' + table + ' — Rs ' + Number(total).toFixed(2) + '. Mark as paid?';
      document.getElementById('confirm-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('confirm-modal').style.display = 'none';
      pendingTable = null; pendingSession = null;
    }

    document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);

    document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
      const table = pendingTable, sid = pendingSession;
      const pin   = getStoredPin();
      closeModal();
      try {
        const res  = await fetch('/table/' + table + '/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: sid, pin })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Checkout failed');
        loadBills();
      } catch (err) { alert(err.message); }
    });

    loadBills();
    setInterval(loadBills, 5000);
  </script>
</body>
</html>
